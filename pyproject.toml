[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rollypay"
version = "0.2.0"
description = "Официальный Python SDK для платежной системы RollyPay"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "RollyPay Team", email = "support@rollypay.io" },
]
keywords = [
    "rollypay",
    "payments",
    "sdk",
    "api",
    "crypto",
    "acquiring",
    "payment-gateway",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Office/Business :: Financial :: Point-Of-Sale",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests>=2.25.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-requests>=2.32",
]

[project.urls]
Homepage = "https://rolly.pro"
Documentation = "https://docs.rollypay.io"
Source = "https://github.com/RlyPy/sdk-python"
Tracker = "https://github.com/RlyPy/sdk-python/issues"

[tool.setuptools.packages.find]
include = ["rollypay*"]

[tool.setuptools.package-data]
rollypay = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.9"
packages = ["rollypay"]
ignore_missing_imports = true
